overview: "Display FilmAffinity ratings on movies and TV shows in Jellyfin."
description: >
  Fetches FilmAffinity scores for movies and TV series using Wikidata (P480) ID resolution
  and a configurable external score endpoint (JSON API or FilmAffinity HTML proxy/mirror),
  writing scores to Jellyfin's native CommunityRating (and optionally CriticRating) and
  registering clickable FilmAffinity external links.
