name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Determine Version
        id: version
        run: |
          RAW_TAG="${GITHUB_REF_NAME#v}"
          # Normalize to 4-part assembly version (e.g. 1.0.0 -> 1.0.0.0)
          IFS='.' read -ra PARTS <<< "$RAW_TAG"
          while [ ${#PARTS[@]} -lt 4 ]; do PARTS+=("0"); done
          VERSION="${PARTS[0]}.${PARTS[1]}.${PARTS[2]}.${PARTS[3]}"
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build & Test
        run: |
          dotnet build Jellyfin.Plugin.FilmAffinity.slnx \
            --configuration Release \
            -p:Version=${{ steps.version.outputs.version }} \
            -p:AssemblyVersion=${{ steps.version.outputs.version }} \
            -p:FileVersion=${{ steps.version.outputs.version }}
          dotnet test Jellyfin.Plugin.FilmAffinity.slnx --configuration Release --no-build

      - name: Package Plugin ZIP
        id: package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ZIP_NAME="jellyfin-plugin-filmaffinity_${VERSION}.zip"
          STAGE_DIR="dist/stage"
          mkdir -p "${STAGE_DIR}"
          cp "Jellyfin.Plugin.FilmAffinity/bin/Release/net10.0/Jellyfin.Plugin.FilmAffinity.dll" "${STAGE_DIR}/"
          (cd "${STAGE_DIR}" && zip -r "../${ZIP_NAME}" .)
          CHECKSUM=$(md5sum "dist/${ZIP_NAME}" | awk '{print $1}')
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"
          echo "checksum=${CHECKSUM}" >> "$GITHUB_OUTPUT"
          echo "timestamp=${TIMESTAMP}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "FilmAffinity Ratings ${{ steps.version.outputs.tag }}"
          generate_release_notes: true
          files: dist/${{ steps.package.outputs.zip_name }}

      - name: Update manifest.json on main
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          ZIP_NAME: ${{ steps.package.outputs.zip_name }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
          TIMESTAMP: ${{ steps.package.outputs.timestamp }}
          REPO: ${{ github.repository }}
        run: |
          git checkout main
          python3 - <<'PY'
          import json, os

          with open("manifest.json", "r", encoding="utf-8") as f:
              manifest = json.load(f)

          entry = {
              "version": os.environ["VERSION"],
              "changelog": f"Release {os.environ['TAG']}",
              "targetAbi": "12.0.0.0",
              "sourceUrl": f"https://github.com/{os.environ['REPO']}/releases/download/{os.environ['TAG']}/{os.environ['ZIP_NAME']}",
              "checksum": os.environ["CHECKSUM"],
              "timestamp": os.environ["TIMESTAMP"],
          }

          versions = [v for v in manifest[0].get("versions", []) if v.get("version") != entry["version"]]
          versions.insert(0, entry)
          manifest[0]["versions"] = versions

          with open("manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "chore(release): update manifest.json for ${TAG}"
          git push origin main
